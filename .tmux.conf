# ~/.tmux.conf

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',xterm-kitty:clipboard'
set -s set-clipboard external

# General
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g status-keys vi
set -g history-limit 100000
set -g renumber-windows on
set -g mouse off
set -g visual-activity off
set -g focus-events on
set -g detach-on-destroy off

setw -g mode-keys vi
setw -g monitor-activity on

set -sg escape-time 0

# Reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pane navigation: no prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane resize: no prefix
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 1
bind -n M-S-Down  resize-pane -D 1

# New panes/windows inherit cwd
bind '"' split-window -v -c '#{pane_current_path}'
bind %   split-window -h -c '#{pane_current_path}'
bind c   new-window -c '#{pane_current_path}'

# Zoom active pane (same as modern tmux default, made explicit)
bind z resize-pane -Z

# vi copy mode. OSC 52 sends the copied text through kitty.
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Session/project picker implemented by our wrapper.
# Requires tmux-wrapper in PATH and fzf for interactive picker.
bind f display-popup -E -w 70% -h 70% 'tmux-wrapper'

# Disposable tools. Keep tmux as the owner of the real layout.
bind p display-popup -E -w 80% -h 80%
bind g display-popup -E -w 90% -h 90% lazygit
bind h display-popup -E -w 80% -h 80% htop

# Status line
set-option -g status-justify left
set-option -g status-left '#[bg=colour235]#[fg=colour185] #S@#(hostname -f) #[fg=colour235]#[bg=colour236]#[fg=colour215] #(cat /proc/loadavg | cut -d " " -f1) #[fg=colour236]#[bg=colour237] '
set-option -g status-left-length 30
set-option -g status-right-length 200
set-option -g status-bg colour237
set-option -g status-right '#[bg=colour237]#[fg=colour236]#[bg=colour236]#[fg=colour215]  #(ext_addr)  #(int_addr) #(battery) #[bg=colour235]#[fg=colour185] #(date "+%d.%m.%y %H:%M") '
set-option -g status-interval 60

# Pane borders
set-option -g pane-border-status bottom
set-option -g pane-border-format ' #{pane_index} #{pane_current_command} '
set-option -g pane-active-border-style fg=colour245
set-option -g pane-border-style fg=colour243

# Windows
set-window-option -g window-status-format '#[fg=colour107] #F#I #[fg=colour110] #W #[fg=colour195]'
set-window-option -g window-status-current-format '#[fg=colour237]#[bg=colour236]#[bg=colour236]#[fg=colour215] #F#I #[fg=colour167]#W #[fg=colour236]#[bg=colour237]'
set-window-option -g window-status-activity-style 'bg=colour240,blink'
