# ~/.config/kitty/kitty.conf
# Kitty is only the terminal frontend. tmux owns sessions/windows/panes.

# Fonts
font_family Go Mono
font_size 9.0
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7,U+E500-U+E5FF,U+F000-U+FFFF TerminessTTF Nerd Font
symbol_map U+1F510-U+1F53D Noto Color Emoji

# Appearance
background_opacity 0.7

# Clipboard
# Mouse selection goes straight to the desktop clipboard.
copy_on_select clipboard
strip_trailing_spaces smart

# OSC 52 from tmux/applications. "no-append" is recommended for kitty+tmux.
clipboard_control write-primary write-clipboard no-append read-clipboard-ask read-primary-ask

# Keep C/V usable while Russian layout is active.
map ctrl+shift+м paste_from_clipboard
map ctrl+shift+с copy_to_clipboard

# Keyboard-driven picking from whatever tmux rendered on screen.
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>h kitten hints --type hash --program -
map ctrl+shift+p>n kitten hints --type linenum

# Small harmless toy.
cursor_trail 3
